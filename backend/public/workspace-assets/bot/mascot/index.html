<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bot — character study</title>
<style>
@font-face{font-family:Manrope;src:url('../fonts/Manrope-Latin-Variable.woff2')}*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#252420;font-family:Manrope,system-ui,sans-serif}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:36px 24px;gap:32px}header{width:100%;display:flex;align-items:center;justify-content:space-between}h1{font-size:28px;letter-spacing:-1.5px;margin:0;font-weight:650}a{color:inherit;font-size:13px;text-decoration:none}a:hover{text-decoration:underline}.stage{flex:1;min-height:300px;display:grid;place-items:center;width:100%}.stage svg{width:clamp(170px,30vw,290px);overflow:visible}.sizes{display:flex;align-items:center;gap:22px;height:48px}.sizes img{display:block}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}button{font:inherit;font-size:13px;background:transparent;color:inherit;border:1px solid transparent;border-radius:30px;padding:10px 18px;cursor:pointer}button[aria-pressed=true]{background:#eae8e2}button:hover{border-color:#d4d0c7}button:focus-visible,a:focus-visible{outline:2px solid currentColor;outline-offset:4px}@media(prefers-color-scheme:dark){body{background:#1d1c19;color:#faf9f6}.body{fill:#e4e1d9}.eye{fill:#252420}button[aria-pressed=true]{background:#35332e}.sizes{filter:invert(1)}}
</style>
<main>
<header><h1>bot</h1><a href="tovi.svg" download>Download SVG ↗</a></header>
<div class="stage"><svg viewBox="0 0 128 128" role="img" aria-label="bot character: idle"><g id="body"><path id="silhouette" class="body" fill="#252420" d="M64 17C88 17 107 32 109 55C112 80 96 105 70 109C45 113 22 99 19 76C15 51 36 18 64 17Z"/><g id="gaze"><rect class="eye" id="left" x="47" y="53" width="10" height="22" rx="5" fill="#FAF9F6"/><rect class="eye" id="right" x="72" y="50" width="10" height="22" rx="5" fill="#FAF9F6"/></g></g></svg></div>
<div class="sizes" aria-label="Icon sizes"><img src="tovi.svg" width="20" height="20" alt="20 pixel icon"><img src="tovi.svg" width="32" height="32" alt="32 pixel icon"><img src="tovi.svg" width="48" height="48" alt="48 pixel icon"></div>
<nav aria-label="Character state"><button aria-pressed="true" data-state="gesture">Right → up</button><button aria-pressed="false" data-state="loop">Loop</button><button aria-pressed="false" data-state="original">Original</button><button aria-pressed="false" data-state="round">Round</button><button aria-pressed="false" data-state="pebble">Pebble</button><button aria-pressed="false" data-state="square">Square</button><button aria-pressed="false" data-state="triangle">Triangle</button><button id="pause" aria-pressed="false">Pause</button></nav>
</main>
<script type="module" src="motion.js?v=5"></script>
</html>
